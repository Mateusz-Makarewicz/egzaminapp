<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test INF.03</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>

<section id="start">
    <header class="naglowek">
        <div>
            <h1>Test INF.03</h1>
            <p class="szary">Baza: <span id="baza"></span> pytań</p>
        </div>
        <button class="maly" id="btnSzukaj">Wyszukiwarka pytań</button>
    </header>

    <div class="sekcja-gora">
        <h3 class="etykieta">Ustawienia</h3>
        <button class="maly" id="btnPreset" title="40 pytań, 60 minut, próg 50%">Jak na egzaminie</button>
    </div>

    <div class="pola">
        <label>Liczba pytań
            <input type="number" id="liczba" value="40" min="1">
        </label>
        <label>Próg zaliczenia (%)
            <input type="number" id="prog" value="50" min="1" max="100">
        </label>
        <label id="poleCalosc">Czas testu (min)
            <input type="number" id="minuty" value="40" min="1">
        </label>
        <label id="polePytanie" hidden>Czas na pytanie (s)
            <input type="number" id="sekundy" value="60" min="1">
        </label>
    </div>

    <h3 class="etykieta">Tryb</h3>
    <div class="tryby">
        <label class="tryb">
            <input type="radio" name="tryb" value="calosc" checked>
            <strong>Czas na cały test</strong>
            <span>Jedno odliczanie na całość</span>
        </label>
        <label class="tryb">
            <input type="radio" name="tryb" value="pytanie">
            <strong>Czas na pytanie</strong>
            <span>Osobny limit dla każdego</span>
        </label>
        <label class="tryb">
            <input type="radio" name="tryb" value="nauka">
            <strong>Tryb nauki</strong>
            <span>Bez czasu, od razu widać odpowiedź</span>
        </label>
    </div>

    <button class="glowny duzy" id="btnStart">Rozpocznij</button>
</section>

<section id="test" hidden>
    <div class="pasek"><div id="postep"></div></div>
    <div class="gora">
        <span id="licznik"></span>
        <span id="czas"></span>
        <button class="maly" id="btnPauza">Pauza</button>
    </div>
    <p id="pauzaInfo" hidden>Pauza. Czas jest zatrzymany, pytanie jest ukryte.</p>
    <div id="zawartosc">
        <h2 id="tresc"></h2>
        <img id="obraz" hidden>
        <div id="odpowiedzi"></div>
        <p id="info" hidden></p>
        <button class="glowny duzy" id="btnDalej" disabled>Dalej</button>
    </div>
</section>

<section id="wynik" hidden>
    <div class="podsumowanie">
        <p class="werdykt" id="werdykt"></p>
        <p class="duze" id="punkty"></p>
        <p class="szary" id="procent"></p>
        <p class="szary" id="uwaga" hidden></p>
    </div>
    <div class="przyciski">
        <button class="glowny" id="btnBledy">Pokaż błędne odpowiedzi</button>
        <button id="btnWszystkie">Pokaż wszystkie pytania</button>
    </div>
    <div id="przeglad" hidden></div>
    <button class="duzy" id="btnNowy">Nowy test</button>
</section>

<section id="szukaj" hidden>
    <header class="naglowek">
        <h1>Wyszukiwarka</h1>
        <button class="maly" id="btnWroc">← Wróć</button>
    </header>
    <input type="search" id="fraza" placeholder="Szukaj w pytaniach i odpowiedziach">
    <p class="szary" id="liczbaWynikow"></p>
    <div id="wyniki"></div>
    <button class="duzy" id="btnWiecej" hidden>Pokaż więcej</button>
</section>

</main>

let znalezione = [], pokazane = 0, opoznienie = null;
const PORCJA = 30;

function normalizuj(t) {
    return t.toLowerCase().replace(/ł/g, "l").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
const INDEKS = PYTANIA.map(p => normalizuj(p.q + " " + p.a.join(" ")));

$("baza").textContent = PYTANIA.length;
$("liczba").max = PYTANIA.length;

function pokaz(id) {
    ["start", "test", "wynik", "szukaj"].forEach(s => $(s).hidden = s !== id);
}

function losuj(n) {
    const kopia = PYTANIA.slice();
    for (let i = kopia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [kopia[i], kopia[j]] = [kopia[j], kopia[i]];
    }
    return kopia.slice(0, n);
}

function ustawObraz(el, p) {
    if (p.img) {
        el.alt = "Brak obrazka " + p.img + " w folderze " + FOLDER_OBRAZKOW;
        el.src = FOLDER_OBRAZKOW + p.img;
        el.hidden = false;
    } else {
        el.hidden = true;
        el.alt = "";
        el.removeAttribute("src");
    }
}

function formatCzasu(sek) {
    const m = Math.floor(sek / 60);
    const s = sek % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function ustawCzas(sek) {
    koniecCzasu = Date.now() + sek * 1000;
}

function tyk() {
    if (pauza) return;
    const zostalo = Math.max(0, Math.ceil((koniecCzasu - Date.now()) / 1000));
    $("czas").textContent = formatCzasu(zostalo);
    $("czas").classList.toggle("malo", zostalo <= 10);
    if (zostalo > 0) return;
    if (tryb === "calosc") koniec(true);
    else dalej();
}

function przelaczPauze() {
    if (!pauza) {
        pozostaloMs = Math.max(0, koniecCzasu - Date.now());
        pauza = true;
    } else {
        koniecCzasu = Date.now() + pozostaloMs;
        pauza = false;
    }
    $("zawartosc").hidden = pauza;
    $("pauzaInfo").hidden = !pauza;
    $("btnPauza").textContent = pauza ? "Wznów" : "Pauza";
}

function odswiezPola() {
    const t = document.querySelector('input[name="tryb"]:checked').value;
    $("poleCalosc").hidden = t !== "calosc";
    $("polePytanie").hidden = t !== "pytanie";
}

function preset() {
    $("liczba").value = Math.min(40, PYTANIA.length);
    $("prog").value = 50;
    $("minuty").value = 60;
    document.querySelector('input[name="tryb"][value="calosc"]').checked = true;
    odswiezPola();
}

function start() {
    let n = parseInt($("liczba").value);
    if (isNaN(n) || n < 1) n = 40;
    n = Math.min(n, PYTANIA.length);

    progZaliczenia = parseFloat($("prog").value);
    if (isNaN(progZaliczenia) || progZaliczenia < 1 || progZaliczenia > 100) progZaliczenia = 50;

    tryb = document.querySelector('input[name="tryb"]:checked').value;
    if (tryb === "calosc") {
        let min = parseFloat($("minuty").value);
        if (isNaN(min) || min <= 0) min = 40;
        limit = Math.round(min * 60);
    } else if (tryb === "pytanie") {
        let sek = parseInt($("sekundy").value);
        if (isNaN(sek) || sek < 1) sek = 60;
        limit = sek;
    }

    test = losuj(n);
    odpowiedzi = [];
    nr = 0;
    pauza = false;
    $("zawartosc").hidden = false;
    $("pauzaInfo").hidden = true;
    $("btnPauza").textContent = "Pauza";
    $("czas").hidden = tryb === "nauka";
    $("btnPauza").hidden = tryb === "nauka";

    clearInterval(zegar);
    if (tryb === "calosc") ustawCzas(limit);
    pokaz("test");
    pokazPytanie();
    if (tryb !== "nauka") {
        tyk();
        zegar = setInterval(tyk, 250);
    }
}

function pokazPytanie() {
    const p = test[nr];
    wybrane = null;
    if (tryb === "pytanie") {
        ustawCzas(limit);
        $("czas").textContent = formatCzasu(limit);
    }
    $("licznik").textContent = "Pytanie " + (nr + 1) + " z " + test.length;
    $("postep").style.width = (nr / test.length * 100) + "%";
    $("tresc").textContent = p.q;
    ustawObraz($("obraz"), p);
    $("info").hidden = true;

    const box = $("odpowiedzi");
    box.innerHTML = "";
    p.a.forEach((tekst, i) => {
        const btn = document.createElement("button");
        btn.className = "opcja";
        btn.textContent = "ABCD"[i] + ". " + tekst;
        btn.onclick = () => wybierz(i, btn, p);
        box.appendChild(btn);
    });

    $("btnDalej").disabled = true;
    $("btnDalej").textContent = nr === test.length - 1 ? "Zakończ" : "Dalej";
}

function wybierz(i, btn, p) {
    const przyciski = $("odpowiedzi").querySelectorAll(".opcja");
    if (tryb === "nauka") {
        if (wybrane !== null) return;
        wybrane = i;
        przyciski.forEach((b, j) => {
            b.classList.add("zablokowana");
            if (j === p.c) b.classList.add("dobra");
            else if (j === i) b.classList.add("zla");
        });
        const dobrze = i === p.c;
        $("info").textContent = dobrze ? "Dobrze." : "Błędnie. Poprawna odpowiedź: " + "ABCD"[p.c] + ".";
        $("info").className = dobrze ? "dobra" : "zla";
        $("info").hidden = false;
    } else {
        wybrane = i;
        przyciski.forEach(b => b.classList.remove("wybrana"));
        btn.classList.add("wybrana");
    }
    $("btnDalej").disabled = false;
}

function dalej() {
    odpowiedzi.push(wybrane);
    nr++;
    if (nr < test.length) pokazPytanie();
    else koniec(false);
}

function koniec(zCzasu) {
    clearInterval(zegar);
    if (zCzasu) {
        odpowiedzi.push(wybrane);
        while (odpowiedzi.length < test.length) odpowiedzi.push(null);
    }

    let dobre = 0, brak = 0;
    test.forEach((p, i) => {
        if (odpowiedzi[i] === null) brak++;
        else if (odpowiedzi[i] === p.c) dobre++;
    });

    const proc = dobre / test.length * 100;
    const zdane = proc >= progZaliczenia;
    $("werdykt").textContent = zdane ? "ZDANE" : "NIEZDANE";
    $("werdykt").className = "werdykt " + (zdane ? "zdane" : "niezdane");
    $("punkty").textContent = dobre + " / " + test.length;
    $("procent").textContent = Math.round(proc * 10) / 10 + "% poprawnych odpowiedzi (próg zaliczenia: " + progZaliczenia + "%)";

    let uwaga = zCzasu ? "Czas minął. " : "";
    if (brak > 0) uwaga += "Pytań bez odpowiedzi: " + brak + " (liczone jako błędne).";
    $("uwaga").textContent = uwaga;
    $("uwaga").hidden = uwaga === "";

    $("btnBledy").hidden = dobre === test.length;
    $("btnBledy").classList.remove("aktywny");
    $("btnWszystkie").classList.remove("aktywny");
    $("przeglad").hidden = true;
    $("przeglad").innerHTML = "";
    pokaz("wynik");
}

function dodaj(rodzic, tag, tekst, klasa) {
    const el = document.createElement(tag);
    el.textContent = tekst;
    if (klasa) el.className = klasa;
    rodzic.appendChild(el);
    return el;
}

function rysujPytanie(rodzic, p, numer, moja, stan) {
    const blok = dodaj(rodzic, "div", "", "blok " + stan);
    dodaj(blok, "h3", numer + p.q);
    if (p.img) {
        const img = document.createElement("img");
        ustawObraz(img, p);
        blok.appendChild(img);
    }
    if (moja === null) dodaj(blok, "p", "Brak odpowiedzi", "brak");

    p.a.forEach((tekst, j) => {
        let klasa = "odp";
        let opis = "";
        if (j === p.c) {
            klasa += " dobra";
            opis = "Poprawna";
        }
        if (j === moja) {
            if (j === p.c) opis = "Twoja odpowiedź · poprawna";
            else {
                klasa += " zla";
                opis = "Twoja odpowiedź";
            }
        }
        const wiersz = dodaj(blok, "div", "ABCD"[j] + ". " + tekst, klasa);
        if (opis) dodaj(wiersz, "span", opis, "tag");
    });
}

function przeglad(tylkoBledy) {
    const box = $("przeglad");
    box.innerHTML = "";
    test.forEach((p, i) => {
        const ok = odpowiedzi[i] === p.c;
        if (tylkoBledy && ok) return;
        rysujPytanie(box, p, (i + 1) + ". ", odpowiedzi[i], ok ? "ok" : "blad");
    });
    box.hidden = false;
    $("btnBledy").classList.toggle("aktywny", tylkoBledy);
    $("btnWszystkie").classList.toggle("aktywny", !tylkoBledy);
}

function szukaj() {
    const slowa = normalizuj($("fraza").value).split(/\s+/).filter(s => s);
    $("wyniki").innerHTML = "";
    $("btnWiecej").hidden = true;
    znalezione = [];
    pokazane = 0;
    if (slowa.length === 0) {
        $("liczbaWynikow").textContent = "Wpisz frazę, aby wyszukać.";
        return;
    }
    znalezione = PYTANIA.filter((p, i) => slowa.every(s => INDEKS[i].includes(s)));
    $("liczbaWynikow").textContent = "Znaleziono pytań: " + znalezione.length;
    pokazWiecej();
}

function pokazWiecej() {
    const granica = Math.min(pokazane + PORCJA, znalezione.length);
    for (; pokazane < granica; pokazane++) {
        rysujPytanie($("wyniki"), znalezione[pokazane], "", undefined, "");
    }
    $("btnWiecej").hidden = pokazane >= znalezione.length;
}

document.querySelectorAll('input[name="tryb"]').forEach(r => r.onchange = odswiezPola);

$("btnStart").onclick = start;
$("btnPreset").onclick = preset;
$("btnDalej").onclick = dalej;
$("btnPauza").onclick = przelaczPauze;
$("btnBledy").onclick = () => przeglad(true);
$("btnWszystkie").onclick = () => przeglad(false);
$("btnNowy").onclick = () => pokaz("start");
$("btnSzukaj").onclick = () => {
    pokaz("szukaj");
    $("fraza").focus();
};
$("btnWroc").onclick = () => pokaz("start");
$("btnWiecej").onclick = pokazWiecej;
$("fraza").oninput = () => {
    clearTimeout(opoznienie);
    opoznienie = setTimeout(szukaj, 200);
};
</script>
</body>
</html>
